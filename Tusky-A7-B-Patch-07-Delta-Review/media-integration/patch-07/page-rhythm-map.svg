<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1200" viewBox="0 0 1100 1200"><rect width="1100" height="1200" fill="white"/><g font-family="Arial, sans-serif" fill="#252b25"><text x="50" y="55" font-size="30">P07 / 1440 × 900 / measured chapter rhythm</text><text x="50" y="88" font-size="17" fill="#60665f">Document coordinates. Sticky travel is not an empty viewport.</text><rect x="50" y="153.46" width="400" height="197.88" fill="#eeeae4" stroke="#b3b6ad"/><text x="480" y="252.4" font-size="16">Hero / x40 → x1400 / 1360px / r26</text><rect x="50" y="351.34000000000003" width="400" height="55.08" fill="#fff" stroke="#b3b6ad"/><text x="480" y="378.88000000000005" font-size="16">Section pause / 216px / 24svh</text><rect x="50" y="406.42" width="400" height="13.77" fill="#f5f3ef" stroke="#b3b6ad"/><text x="480" y="420.42" font-size="16">Entry top inset / 54px / 6svh</text><rect x="50" y="420.19" width="400" height="201.96" fill="#e0e2db" stroke="#b3b6ad"/><text x="480" y="521.17" font-size="16">C2 entry / same x40 → x1400 / r26 → 0</text><rect x="50" y="622.1500000000001" width="400" height="197.37" fill="#f0f1ed" stroke="#b3b6ad"/><text x="480" y="720.835" font-size="16">Remaining native rail; stage occupies viewport</text><rect x="50" y="819.52" width="400" height="45.9" fill="#fff" stroke="#b3b6ad"/><text x="480" y="842.47" font-size="16">Release pause / 180px / 20svh</text><rect x="50" y="865.42" width="400" height="22.95" fill="#f5f3ef" stroke="#b3b6ad"/><text x="480" y="879.42" font-size="16">C3 internal entry / 90px / 10svh</text><rect x="50" y="888.37" width="400" height="206.55" fill="#e8e5de" stroke="#b3b6ad"/><text x="480" y="991.645" font-size="16">C3 content and bottom breathing</text><text x="50" y="1140" font-size="20">Visible gap 1: 868 → 1138 = 270px / 30svh</text><text x="50" y="1173" font-size="20">Visible gap 2: 2704 → 2974 = 270px / 30svh</text></g></svg>